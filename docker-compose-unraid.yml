version: '3.7'

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      - INDEXER_URL=https://10.2.0.86:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./config/wazuh_cluster/wazuh_manager.conf:/var/ossec/etc/ossec.conf
    labels:
      - net.unraid.docker.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/wazuh.png
      - net.unraid.docker.webui=https://10.2.0.87:5601
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.description=Wazuh Manager - SIEM/XDR Security Manager & Agent Coordinator
    networks:
      br2.2:
        ipv4_address: 10.2.0.85

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh.indexer
    restart: always
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "path.repo=/usr/share/wazuh-indexer/snapshots"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
      - /mnt/user/wazuh-data/snapshots:/usr/share/wazuh-indexer/snapshots
    labels:
      - net.unraid.docker.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/wazuh.png
      - net.unraid.docker.webui=https://10.2.0.86:9200
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.description=Wazuh Indexer - Security Data Storage & Search Engine (OpenSearch)
    networks:
      br2.2:
        ipv4_address: 10.2.0.86

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    hostname: wazuh.dashboard
    restart: always
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://10.2.0.85
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    labels:
      - net.unraid.docker.icon=https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/wazuh.png
      - net.unraid.docker.webui=https://10.2.0.87:5601
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.description=Wazuh Dashboard - Security Analytics & Visualization Interface
    depends_on:
      - wazuh.indexer
    networks:
      br2.2:
        ipv4_address: 10.2.0.87
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

volumes:
  wazuh_api_configuration:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/wazuh_api_configuration
  wazuh_etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/wazuh_etc
  wazuh_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/wazuh-data/live-data/wazuh_logs
  wazuh_queue:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/wazuh-data/live-data/wazuh_queue
  wazuh_var_multigroups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/wazuh-data/live-data/wazuh_var_multigroups
  wazuh_integrations:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/wazuh_integrations
  wazuh_active_response:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/wazuh_active_response
  wazuh_agentless:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/wazuh_agentless
  wazuh_wodles:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/wazuh_wodles
  filebeat_etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/filebeat_etc
  filebeat_var:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/filebeat_var
  wazuh-indexer-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/wazuh-data/live-data/wazuh-indexer-data
  wazuh-dashboard-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/wazuh-dashboard-config
  wazuh-dashboard-custom:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/appdata/wazuh/volumes/wazuh-dashboard-custom

networks:
  br2.2:
    external: true
